<svg viewBox="0 0 1200 627" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle accent glow gradient -->
    <radialGradient id="glow-teal" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="hsl(172, 72%, 44%)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="hsl(172, 72%, 44%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="0.85" cy="0.75" r="0.4">
      <stop offset="0%" stop-color="hsl(38, 88%, 60%)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="hsl(38, 88%, 60%)" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradient text for the monogram -->
    <linearGradient id="mono-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#a0a0aa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#07070a"/>
  <rect width="1200" height="627" fill="url(#glow-teal)"/>
  <rect width="1200" height="627" fill="url(#glow-amber)"/>

  <!-- Subtle grid pattern (very faint) -->
  <g opacity="0.03">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#f5f5f7" stroke-width="1"/>
    <line x1="0" y1="314" x2="1200" y2="314" stroke="#f5f5f7" stroke-width="1"/>
    <line x1="0" y1="471" x2="1200" y2="471" stroke="#f5f5f7" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="627" stroke="#f5f5f7" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="627" stroke="#f5f5f7" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="627" stroke="#f5f5f7" stroke-width="1"/>
  </g>

  <!-- Top accent line -->
  <rect x="80" y="60" width="40" height="3" rx="1.5" fill="hsl(172, 72%, 44%)"/>

  <!-- Monogram "b." — large, left-aligned -->
  <text x="80" y="260" font-family="JetBrains Mono, monospace" font-size="120" font-weight="700" fill="url(#mono-grad)" letter-spacing="-6">
    b<tspan fill="hsl(172, 72%, 44%)">.</tspan>integrations
  </text>

  <!-- Tagline -->
  <text x="84" y="320" font-family="Inter, sans-serif" font-size="30" font-weight="400" fill="#a0a0aa" letter-spacing="0.5">
    Engenharia de software com precisão e propósito.
  </text>

  <!-- Product badges -->
  <g transform="translate(84, 420)">
    <!-- Trivestia badge -->
    <rect x="0" y="0" width="180" height="48" rx="10" fill="#0d0d11" stroke="#1a1a22" stroke-width="1"/>
    <circle cx="24" cy="24" r="5" fill="hsl(38, 88%, 60%)"/>
    <text x="42" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7">Trivestia</text>

    <!-- Avesia badge -->
    <rect x="200" y="0" width="160" height="48" rx="10" fill="#0d0d11" stroke="#1a1a22" stroke-width="1"/>
    <circle cx="224" cy="24" r="5" fill="hsl(172, 72%, 44%)"/>
    <text x="242" y="30" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7">Avesia</text>
  </g>

  <!-- Bottom: role + skills -->
  <text x="84" y="540" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#5a5a66" letter-spacing="0.5">
    Software Engineer · Full Stack · Automation AI
  </text>

  <!-- URL bottom-right -->
  <text x="1120" y="580" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#5a5a66" text-anchor="end">
    brunointegrations.com
  </text>
</svg>
