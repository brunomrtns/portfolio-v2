# =============================================================================
# portfolio-nginx.conf — Fragmento de config para o trivestia-nginx
# Este fragmento é injetado dentro do server block HTTPS do nginx.conf
# pelo deploy.sh do portfolio.
#
# O deploy.sh:
#   1. Faz backup do nginx.conf atual
#   2. Remove o bloco "# ── Portfolio Locations ──" anterior (se existir)
#   3. Injeta este fragmento antes do fechamento do server block
#   4. Reinicia trivestia-nginx
# =============================================================================

    # ── Portfolio Upstreams ───────────────────────────────────────────────
    upstream portfolio_api {
        server portfolio-api:3104;
        keepalive 16;
    }
    upstream portfolio_web {
        server portfolio-web:80;
        keepalive 16;
    }

    # ── Portfolio Locations ───────────────────────────────────────────────
    # Redirect /portfolio → /portfolio/
    location = /portfolio {
        return 301 /portfolio/;
    }

    # Portfolio API
    location /portfolio/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        rewrite ^/portfolio/api/(.*)$ /api/$1 break;
        proxy_pass         http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20M;
    }

    # Portfolio Web (SPA) — strip /portfolio/ prefix so the internal nginx
    # serves assets from /assets/ (not /portfolio/assets/)
    location /portfolio/ {
        limit_req zone=web_limit burst=100 nodelay;
        rewrite ^/portfolio/(.*)$ /$1 break;
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Portfolio homepage — serve at root (replaces redirect to /trivestia/)
    # Exact match for "/" — serves the portfolio landing page
    location = / {
        limit_req zone=web_limit burst=100 nodelay;
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
