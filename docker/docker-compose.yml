# =============================================================================
# docker-compose.yml — Portfolio v2 (API + Web + PostgreSQL)
# =============================================================================

services:
  portfolio-postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - portfolio-pgdata:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  portfolio-api:
    image: portfolio-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      portfolio-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@portfolio-postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3104
      CORS_ORIGIN: ${CORS_ORIGIN}
    networks:
      - portfolio-net
      - trivestia-net
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3104/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  portfolio-web:
    image: portfolio-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    depends_on:
      portfolio-api:
        condition: service_healthy
    networks:
      - portfolio-net
      - trivestia-net
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  portfolio-pgdata:

networks:
  portfolio-net:
    driver: bridge
    name: portfolio-net
  trivestia-net:
    external: true
    name: trivestia-net
